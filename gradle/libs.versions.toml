# Gradle 버전 카탈로그. build.gradle 은 의존성·플러그인 좌표를 전부 여기서 `libs.xxx` 로 가져온다.
#
# 라이브러리 항목은 두 종류다. 섞으면 조용히 깨지므로 추가할 때 어느 쪽인지 먼저 판단한다.
#  - 버전 없는 항목 `{ module = "..." }` — Spring Boot BOM 이 정하는 것(spring-boot-starter, spring-boot-starter-test,
#    spring-boot-configuration-processor, javax.annotation-api, javax.persistence-api, junit-platform-launcher).
#    `io.spring.dependency-management` 가 build.gradle 에서 가져오는 spring-boot-dependencies 로 버전을 고른다.
#    ⚠️ 여기에 버전을 적지 말 것. 직접 적은 버전은 BOM 을 이겨서, BOM 을 올려도 그 의존성만 옛 버전에 묶인다.
#  - 버전 있는 항목 — BOM 이 모르는 것(spring-boot-dependencies 자신, mybatis-spring-boot-starter)과
#    BOM 을 일부러 이기는 것(jakarta.* 3.x. Boot 2.7 BOM 은 jakarta.annotation-api 1.3.5, jakarta.persistence-api 2.2.3 이다).
#    `./gradlew versionCatalogUpdate` 가 이쪽만 갱신한다.
#    VCU 는 버전 없는 항목을 해석 대상에서 건너뛰므로 BOM 관리 항목에 버전을 써 넣지 않는다.
#
# versionCatalogUpdate 가 이 파일을 다시 쓸 때 항목 옆 주석은 사라질 수 있다. 남겨야 하는 설명은
# build.gradle 에 두고, 여기서는 `@pin`(버전 고정) / `@keep`(미사용 항목 유지) 애노테이션만 쓴다.
# 두 애노테이션을 함께 달 때는 한 줄에 하나씩 쓴다(VCU 는 `# @keep` 으로 시작하는 줄만 keep 으로 읽는다).
[versions]
# @keep
# @pin
google-java-format = "1.28.0"
# @keep
jacoco = "0.8.15"

[libraries]
# @pin
jakarta-annotation-api = "jakarta.annotation:jakarta.annotation-api:3.0.0"
# @pin
jakarta-persistence-api = "jakarta.persistence:jakarta.persistence-api:3.2.0"
javax-annotation-api = { module = "javax.annotation:javax.annotation-api" }
javax-persistence-api = { module = "javax.persistence:javax.persistence-api" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
# @pin
mybatis-spring-boot-starter = "org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5"
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
# @keep
# @pin
spring-boot-dependencies = "org.springframework.boot:spring-boot-dependencies:2.7.18"
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }

[plugins]
ben-manes-versions = "io.github.ben-manes.versions:0.62.0"
spotless = "com.diffplug.spotless:8.10.2"
# @pin
spring-dependency-management = "io.spring.dependency-management:1.1.7"
# @pin
vanniktech-maven-publish = "com.vanniktech.maven.publish:0.37.0"
version-catalog-update = "nl.littlerobots.version-catalog-update:1.1.1"
