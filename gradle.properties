# Gradle 빌드 옵션. 설정 캐시, 빌드 캐시, 병렬 실행을 켠다.
# 이 리포의 워크플로(test.yml, tag.yml)에는 원래 이런 명령줄 플래그가 없었다. 이 파일이 생기면서 터미널, IDE, CI 가
# 처음으로 같은 조건(캐시 사용)으로 빌드한다. 그래서 CI 에서도 입력이 같으면 compileJava 나 test 가 FROM-CACHE 로 끝날 수 있다.
#
# ⚠️ 이 파일은 커밋되는 공개 파일이다. Maven Central 계정, 서명 키 ID 와 암호 같은 비밀값은 절대 넣지 않는다.
# 로컬 빌드에 필요하면 ~/.gradle/gradle.properties 에만 둔다. CI 는 tag.yml 이 GitHub secrets 를 -P 인자와 환경변수로 넘긴다.

# 설정 캐시 — 태스크 그래프 계산 결과를 재사용한다.
# 이 리포가 쓰는 태스크는 호환을 확인했다 — check, jar, build, test, jacocoTestReport,
# spotlessCheck/spotlessApply(cleanthat + google-java-format), dependencyUpdates, versionCatalogFormat, versionCatalogApplyUpdates, updateDaemonJvm.
#
# 예외 1: 배포 경로(tag.yml 의 publishToMavenCentral)는 설정 캐시 없이 돈다.
# - generatePomFileForMavenPublication 은 호환되지 않는다. io.spring.dependency-management 가 POM 에 BOM import 를
#   넣으려고 거는 pom.withXml 훅이 Project 를 붙잡고 있어 직렬화에 실패한다. 표시를 지우면 배포가 설정 캐시 오류로 실패한다
#   (--dry-run 으로 확인).
# - 서명(Sign), Central 준비(PrepareMavenCentralPublishingTask), 업로드(PublishToMavenRepository) 태스크는
#   publish 계열이라 로컬에서 실행해 보지 못했다. 실행 시점 문제가 배포를 깨지 않도록 함께 표시했다.
# build.gradle 에서 이 타입들을 notCompatibleWithConfigurationCache 로 표시했다. 배포 태스크는 --dry-run 으로만 확인했다.
#
# 예외 2: versionCatalogUpdate 는 실행 시점에 Task.project 를 써서
# 설정 캐시와 호환되지 않는다. 빌드는 성공하지만 매번 "Configuration cache entry discarded" 가 뜬다.
# 가끔 도는 유지보수용 태스크라 그대로 둔다.
org.gradle.configuration-cache=true

# 빌드 캐시 — compileJava, spotlessJava, test 처럼 캐시할 수 있는 태스크의 산출물을 재사용한다.
org.gradle.caching=true

# 병렬 실행 — 지금은 단일 모듈이라 차이가 없다. 모듈이 늘어나면 그때부터 효과를 보도록 켜 둔다.
org.gradle.parallel=true
