plugins {
    id "org.springframework.boot" version "2.7.18"
    id 'java'
    id "com.vanniktech.maven.publish" version "0.37.0"
    id "io.spring.dependency-management" version "1.1.7"
    id "com.diffplug.spotless" version "8.10.2"
    id "com.github.ben-manes.versions" version "0.61.0"
    id 'signing'
    id 'jacoco'
}

ext {
    GROUP_ID = 'io.github.bestheroz'
    ARTIFACT_ID = 'mybatis-repository'
    VERSION = '0.9.0'
    DESCRIPTION = "MyBatis Repository's Interface"
    GITHUB_URL = "https://github.com/bestheroz/mybatis-repository"
}

group = GROUP_ID
version = VERSION
description = DESCRIPTION

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

// sourceCompatibility/targetCompatibility 만으로는 -source/-target 8 만 전달되어
// 문법만 제한되고 API 는 빌드 JDK 의 것이 그대로 링크된다.
// (String#isBlank 같은 Java 9+ API 가 경고 없이 통과 → Java 8 런타임에서 NoSuchMethodError)
// --release 8 을 써야 Java 8 API 로 컴파일 시점에 검증된다.
tasks.withType(JavaCompile).configureEach {
    options.release.set(8)
}

repositories {
    mavenCentral()
}

dependencies {
    // 소비자(Spring Boot 애플리케이션)가 이미 가지고 있는 것들이므로 compileOnly.
    // implementation 으로 두면 published POM 에 runtime scope 로 나가면서
    // Java 17 바이트코드(jakarta.persistence 3.2.0, mybatis-spring-boot-starter 3.0.5)를
    // Java 8 소비자에게까지 강제하게 된다.
    compileOnly 'org.springframework.boot:spring-boot-starter:2.7.18'
    compileOnly 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
    compileOnly 'jakarta.persistence:jakarta.persistence-api:3.2.0'
    compileOnly 'jakarta.annotation:jakarta.annotation-api:3.0.0'
    compileOnly 'javax.persistence:javax.persistence-api:2.2'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // compileOnly 는 테스트 클래스패스로 전파되지 않으므로 테스트용으로 다시 선언한다.
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
    testImplementation 'jakarta.persistence:jakarta.persistence-api:3.2.0'
    testImplementation 'jakarta.annotation:jakarta.annotation-api:3.0.0'
    testImplementation 'javax.persistence:javax.persistence-api:2.2'
    testImplementation 'javax.annotation:javax.annotation-api:1.3.2'
}

mavenPublishing {
    // 이 호출이 있어야 Maven Central 저장소가 등록되고 tag.yml 이 실행하는
    // publishToMavenCentral 태스크가 생성된다. (0.35.0 부터 SonatypeHost 인자 불필요)
    publishToMavenCentral()

    signAllPublications()

    coordinates(GROUP_ID, ARTIFACT_ID, VERSION)

    pom {
        name.set(ARTIFACT_ID)
        description.set(DESCRIPTION)
        url.set(GITHUB_URL)
        inceptionYear.set("2026")

        licenses {
            license {
                name.set("The Apache License, Version 2.0")
                url.set("http://www.apache.org/licenses/LICENSE-2.0.txt")
                distribution.set("http://www.apache.org/licenses/LICENSE-2.0.txt")
            }
        }

        developers {
            developer {
                id.set("bestheroz")
                name.set("joony.kim")
                url.set("https://github.com/bestheroz")
            }
        }

        scm {
            url.set(GITHUB_URL)
            connection.set("scm:git:git://${GITHUB_URL}.git")
            developerConnection.set("scm:git:ssh://git@github.com:bestheroz/${ARTIFACT_ID}.git")
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

spotless {
    java {
        importOrder()

        // 이 라이브러리는 Java 8 타깃을 유지하므로 CleanThat 이 9+ 문법을
        // 끌어들이지 않도록 소스 레벨을 고정한다.
        cleanthat().sourceCompatibility('1.8')

        // 버전을 비워두면 Spotless 가 "빌드 JVM 이 감당하는 최신 GJF"를 고른다.
        // 즉 로컬(JDK 21)과 CI(JDK 17)가 서로 다른 포매터를 써서 계속 충돌한다.
        // 1.28.0 은 JVM 17+ 에서 동작하므로 CI 기준으로 고정. (1.30.0 은 JVM 21+ 요구)
        googleJavaFormat('1.28.0')

        formatAnnotations()
    }
}

signing {
    useInMemoryPgpKeys(System.getenv("GPG_PRIVATE_KEY"), System.getenv("SIGNING_PASSWORD"))
    sign(publishing.publications)
}

jacoco {
    toolVersion = "0.8.12"
}

jacocoTestReport {
    reports {
        csv.required = true
    }
}

test {
    finalizedBy jacocoTestReport
}
