plugins {
    id 'java'
    id 'jacoco'
    id 'signing'
    alias(libs.plugins.vanniktech.maven.publish)
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.spotless)
    alias(libs.plugins.ben.manes.versions)
    alias(libs.plugins.version.catalog.update)
}

ext {
    GROUP_ID = 'io.github.bestheroz'
    ARTIFACT_ID = 'mybatis-repository'
    VERSION = '1.0.0'
    DESCRIPTION = "MyBatis Repository's Interface"
    GITHUB_URL = "https://github.com/bestheroz/mybatis-repository"
}

group = GROUP_ID
version = VERSION
description = DESCRIPTION

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

// 데몬 JVM 기준(gradle/gradle-daemon-jvm.properties). Gradle 9 는 데몬을 JVM 17+ 에서만 돌리지만 래퍼(클라이언트)는
// JVM 8 에서도 뜬다. 이 파일이 있으면 Gradle 이 JAVA_HOME 과 org.gradle.java.home 보다 우선해 데몬 JVM 을 17 로 고르고,
// 없는 머신에서는 아래 URL 로 내려받아 ~/.gradle/jdks 에 둔다. 그래서 JAVA_HOME 이 8 인 터미널에서도 ./gradlew 가 돈다
// (파일이 없으면 "Gradle requires JVM 17 or later to run. Your build is currently configured to use JVM 8" 로 실패한다).
//
// 17 인 이유: CI(test.yml, tag.yml)의 JDK 이고 google-java-format 1.28.0 핀의 기준이다. setup-java 가 깐 Corretto 17 이
// 그대로 기준에 맞아 CI 는 내려받지 않는다. 21 로 올리면 CI 가 17 밖에 없어 매번 내려받는다. CI 의 JDK 를 올릴 때만 함께 올린다.
// 벤더는 지정하지 않는다. 지정하면 CI 의 Corretto 와 다른 벤더일 때 있는 JDK 를 두고 내려받는다.
// URL 은 Corretto 의 latest 리다이렉트라 17 의 최신 패치를 가리킨다. 이미 내려받은 머신은 ~/.gradle/jdks 의 것을 계속 쓴다.
// Windows ARM 은 Corretto 17 배포판이 없어 JDK 17 을 직접 설치해야 한다.
// 기본 URL 생성은 settings 의 toolchain 저장소 플러그인(foojay)을 요구하므로 URL 을 직접 준다.
// 파일을 다시 만들 때: ./gradlew updateDaemonJvm (파일 안의 주석은 이 태스크가 지우므로 설명은 여기에 둔다)
tasks.named('updateDaemonJvm') {
    languageVersion = JavaLanguageVersion.of(17)
    toolchainDownloadUrls = [
        (org.gradle.platform.BuildPlatformFactory.of(org.gradle.platform.Architecture.X86_64, org.gradle.platform.OperatingSystem.LINUX)):
            uri('https://corretto.aws/downloads/latest/amazon-corretto-17-x64-linux-jdk.tar.gz'),
        (org.gradle.platform.BuildPlatformFactory.of(org.gradle.platform.Architecture.AARCH64, org.gradle.platform.OperatingSystem.LINUX)):
            uri('https://corretto.aws/downloads/latest/amazon-corretto-17-aarch64-linux-jdk.tar.gz'),
        (org.gradle.platform.BuildPlatformFactory.of(org.gradle.platform.Architecture.X86_64, org.gradle.platform.OperatingSystem.MAC_OS)):
            uri('https://corretto.aws/downloads/latest/amazon-corretto-17-x64-macos-jdk.tar.gz'),
        (org.gradle.platform.BuildPlatformFactory.of(org.gradle.platform.Architecture.AARCH64, org.gradle.platform.OperatingSystem.MAC_OS)):
            uri('https://corretto.aws/downloads/latest/amazon-corretto-17-aarch64-macos-jdk.tar.gz'),
        (org.gradle.platform.BuildPlatformFactory.of(org.gradle.platform.Architecture.X86_64, org.gradle.platform.OperatingSystem.WINDOWS)):
            uri('https://corretto.aws/downloads/latest/amazon-corretto-17-x64-windows-jdk.zip'),
    ]
}

// sourceCompatibility/targetCompatibility 만으로는 -source/-target 8 만 전달되어
// 문법만 제한되고 API 는 빌드 JDK 의 것이 그대로 링크된다.
// (String#isBlank 같은 Java 9+ API 가 경고 없이 통과 → Java 8 런타임에서 NoSuchMethodError)
// --release 8 을 써야 Java 8 API 로 컴파일 시점에 검증된다.
tasks.withType(JavaCompile).configureEach {
    options.release.set(8)

    // 소스에 한글 주석과 메시지가 있다. 예전에는 org.springframework.boot 플러그인이
    // encoding 이 비어 있으면 UTF-8 을 채워 주었다. 빌드 JVM 의 기본 인코딩에 기대지 않도록 직접 건다.
    options.encoding = 'UTF-8'

    // -parameters 는 이 라이브러리가 동작하기 위한 필수 조건이다. 편의 옵션이 아니다.
    // MyBatis 는 인자가 하나뿐인 프로바이더(buildSelectOneSQL/buildCountSQL/buildDeleteSQL)에
    // 사용자가 넘긴 맵이 아니라 ParamMap 전체를 넘기고, MybatisClauseBuilder 는 거기서
    // "whereConditions" 키를 꺼내 조건 맵을 되찾는다. 그 키 이름은 배포되는 jar 의
    // MethodParameters 속성에서 나온다. 속성이 없으면 키가 arg0/arg1 이 되고,
    // ParamMap#get 은 없는 키에 null 대신 BindingException 을 던지므로
    // getItemById/getItemByMap/countAll/countByMap/deleteById/deleteByMap 여섯 개가
    // 소비자 쪽에서 "Parameter 'whereConditions' not found" 로 죽는다.
    //
    // 예전에는 org.springframework.boot 플러그인이 모든 JavaCompile 에 이 옵션을 얹어 주어
    // 우연히 지켜지고 있었다. 그 플러그인은 라이브러리에 잘못 붙어 있던 것이고 Gradle 9 에서 동작하지 않아
    // 떼어 냈다. 그래서 여기서 직접 건다.
    // MybatisProviderBindingTest.compiledClasses_ShouldCarryParameterNames 가 이 속성이 살아 있는지 확인한다.
    options.compilerArgs << '-parameters'
}

// spring-boot-configuration-processor 는 src/main/resources 의
// META-INF/additional-spring-configuration-metadata.json 을 spring-configuration-metadata.json 에 합친다.
// Gradle 은 리소스를 클래스 출력과 다른 폴더에 두므로 이 인자로 위치를 알려 줘야 한다.
// 예전에는 org.springframework.boot 플러그인이 같은 값을 넣어 주었다. 빠지면 배포 jar 의 메타데이터에서
// mybatis-repository.* 설명과 기본값이 사라진다.
//
// 인자는 위치만 알려 줄 뿐 JSON 내용을 compileJava 의 입력으로 만들지 않는다. 그러면 JSON 만 고친 커밋에서
// compileJava 가 빌드 캐시에 적중해 옛 병합 결과를 복원하고, clean 을 해도 배포 jar 에 옛 메타데이터가 실린다
// (이 줄이 없던 build.gradle 로 재현함). Spring Boot 문서가 권하는 대로 processResources 출력을 입력으로 선언한다.
tasks.named('compileJava', JavaCompile) {
    options.compilerArgs << "-Aorg.springframework.boot.configurationprocessor.additionalMetadataLocations=${sourceSets.main.resources.srcDirs.join(',')}".toString()
    inputs.files(tasks.named('processResources'))
}

// 배포 jar 이름의 -plain 분류자는 org.springframework.boot 플러그인이 bootJar 와 구분하려고 붙이던 것이다.
// Maven Central 에는 이미 mybatis-repository-X-plain.jar 로 올라가 있고 POM 은 <packaging>pom</packaging> 이다.
// 플러그인을 떼면서 분류자까지 없어지면 배포 산출물의 파일명과 POM 이 바뀌므로 그대로 유지한다.
tasks.named('jar') {
    archiveClassifier = 'plain'
}

repositories {
    mavenCentral()
}

// org.springframework.boot 플러그인이 하던 BOM 가져오기를 직접 한다.
// 카탈로그에서 버전 없는 좌표가 여기서 버전을 받는다(규칙은 카탈로그 머리말 참고).
// 배포 POM 의 <dependencyManagement> 에 이 BOM import 가 실린다(generatedPomCustomization 기본값). 기존 배포본과 같다.
// mavenBom 은 문자열만 받아 VCU 가 이 항목을 쓰는 곳을 찾지 못하므로 카탈로그에서 @keep 으로 남긴다.
// 좌표 문자열은 toString() 의 출력 형식에 기대지 않고 group:name:version 을 직접 조립한다.
def springBootBom = libs.spring.boot.dependencies.get()
dependencyManagement {
    imports {
        mavenBom "${springBootBom.module.group}:${springBootBom.module.name}:${springBootBom.versionConstraint.requiredVersion}"
    }
}

// 좌표는 전부 gradle/libs.versions.toml 에 있고 여기서는 `libs.xxx` 로만 참조한다.
//
// 카탈로그의 `# @pin` 은 versionCatalogUpdate 가 그 항목을 건드리지 못하게 막는다. 메이저 업그레이드를 하지 않기로 했기 때문이다.
// spring-boot-dependencies 2.7, mybatis-spring-boot-starter 3.0, jakarta.* 3.x 는 Spring Boot 2.7 호환의 기준이고,
// 테스트도 이 BOM 이 고른 Boot 2.7 계열 위에서 돈다. VCU(STABLE)는 메이저를 가리지 않고 최신 정식판을 고르므로
// 핀을 떼지 말고, 같은 메이저 안의 새 버전은 Maven Central 메타데이터를 확인해 손으로 올린다.
//
// 플러그인은 배포 산출물을 만드는지로 가른다. io.spring.dependency-management 는 배포 POM 의 BOM import 를,
// com.vanniktech.maven.publish 는 발행 구성과 POM, .module 을 만들므로 둘 다 핀한다.
// spotless, ben-manes, jacoco 는 개발과 CI 에서만 돌고 소비자 산출물에 닿지 않으므로 핀하지 않는다.
// 새 메이저가 이들을 깨뜨리면(예: 더 높은 JVM 요구) 배포 전에 test.yml(JDK 17)에서 드러난다.
dependencies {
    // 소비자(Spring Boot 애플리케이션)가 이미 가지고 있는 것들이므로 compileOnly.
    // implementation 으로 두면 published POM 에 runtime scope 로 나가면서
    // Java 17 바이트코드(jakarta.persistence 3.2.0, mybatis-spring-boot-starter 3.0.5)를
    // Java 8 소비자에게까지 강제하게 된다.
    compileOnly libs.spring.boot.starter
    compileOnly libs.mybatis.spring.boot.starter
    compileOnly libs.jakarta.persistence.api
    compileOnly libs.jakarta.annotation.api
    compileOnly libs.javax.persistence.api
    compileOnly libs.javax.annotation.api

    annotationProcessor libs.spring.boot.configuration.processor

    // compileOnly 는 테스트 클래스패스로 전파되지 않으므로 테스트용으로 다시 선언한다.
    testImplementation libs.spring.boot.starter.test
    testImplementation libs.mybatis.spring.boot.starter
    testImplementation libs.jakarta.persistence.api
    testImplementation libs.jakarta.annotation.api
    testImplementation libs.javax.persistence.api
    testImplementation libs.javax.annotation.api
    // Gradle 9 부터 JUnit Platform launcher 를 Gradle 배포판에서 넣어 주지 않는다.
    // 없으면 test 가 "Failed to load JUnit Platform" 으로 테스트를 하나도 돌리지 못하고 실패한다(9.7.1 에서 확인).
    // 버전은 Spring Boot BOM 이 가져오는 junit-bom 이 정한다.
    testRuntimeOnly libs.junit.platform.launcher
}

mavenPublishing {
    // 이 호출이 있어야 Maven Central 저장소가 등록되고 tag.yml 이 실행하는
    // publishToMavenCentral 태스크가 생성된다. (0.35.0 부터 SonatypeHost 인자 불필요)
    publishToMavenCentral()

    signAllPublications()

    coordinates(GROUP_ID, ARTIFACT_ID, VERSION)

    pom {
        name.set(ARTIFACT_ID)
        description.set(DESCRIPTION)
        url.set(GITHUB_URL)
        inceptionYear.set("2026")

        licenses {
            license {
                name.set("The Apache License, Version 2.0")
                url.set("http://www.apache.org/licenses/LICENSE-2.0.txt")
                distribution.set("http://www.apache.org/licenses/LICENSE-2.0.txt")
            }
        }

        developers {
            developer {
                id.set("bestheroz")
                name.set("joony.kim")
                url.set("https://github.com/bestheroz")
            }
        }

        scm {
            url.set(GITHUB_URL)
            connection.set("scm:git:git://${GITHUB_URL}.git")
            developerConnection.set("scm:git:ssh://git@github.com:bestheroz/${ARTIFACT_ID}.git")
        }
    }
}

signing {
    useInMemoryPgpKeys(System.getenv("GPG_PRIVATE_KEY"), System.getenv("SIGNING_PASSWORD"))
    sign(publishing.publications)
}

// io.spring.dependency-management 는 배포 POM 에 BOM import 를 넣으려고 pom.withXml 훅을 거는데,
// 그 훅이 Project 를 붙잡고 있어 설정 캐시가 generatePomFileForMavenPublication 을 직렬화하지 못한다.
// 표시하지 않으면 gradle.properties 의 설정 캐시 때문에 tag.yml 의 publishToMavenCentral 이 시작도 못 하고 실패한다
// (9.7.1 에서 --dry-run 으로 확인). 표시해 두면 이 태스크가 그래프에 있는 빌드만 설정 캐시 없이 돈다.
tasks.withType(GenerateMavenPom).configureEach {
    notCompatibleWithConfigurationCache('io.spring.dependency-management 의 POM 커스터마이징이 Project 를 참조한다')
}

// 서명, Central 준비, 업로드 태스크는 publish 계열이라 로컬에서 실행해 보지 못했고, --dry-run 은 설정 캐시 저장 단계의
// 문제만 드러낸다. Gradle 규칙상 표시하지 않은 태스크의 실행 시점 문제는 여전히 빌드를 실패시키므로 함께 표시한다.
// 배포 빌드는 위 POM 태스크 때문에 어차피 설정 캐시 항목을 버리므로 잃는 것이 없고, check·jar·test 그래프에는 없다.
// 대상 타입은 publishToMavenCentral --dry-run 그래프에서 확인했다
// (signMavenPublication, prepareMavenCentralPublishing, publishMavenPublicationToMavenCentralRepository).
tasks.withType(Sign).configureEach {
    notCompatibleWithConfigurationCache('배포 경로. 설정 캐시 아래 실행을 검증하지 못했다')
}
tasks.withType(PublishToMavenRepository).configureEach {
    notCompatibleWithConfigurationCache('배포 경로. 설정 캐시 아래 실행을 검증하지 못했다')
}
tasks.withType(com.vanniktech.maven.publish.central.PrepareMavenCentralPublishingTask).configureEach {
    notCompatibleWithConfigurationCache('배포 경로. 설정 캐시 아래 실행을 검증하지 못했다')
}

// toolVersion 은 의존성 선언이 아니라 VCU 가 쓰는 곳을 찾지 못하므로 카탈로그에서 @keep 으로 남긴다.
jacoco {
    toolVersion = libs.versions.jacoco.get()
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy(tasks.named('jacocoTestReport'))
}

// CI(test.yml)의 커버리지 배지가 이 CSV 를 읽는다.
tasks.named('jacocoTestReport', JacocoReport) {
    reports {
        csv.required = true
    }
}

spotless {
    java {
        importOrder()

        // 이 라이브러리는 Java 8 타깃을 유지하므로 CleanThat 이 9+ 문법을
        // 끌어들이지 않도록 소스 레벨을 고정한다.
        cleanthat().sourceCompatibility('1.8')

        // 버전을 비워두면 Spotless 가 "빌드 JVM 이 감당하는 최신 GJF"를 고른다.
        // 즉 로컬(JDK 21)과 CI(JDK 17)가 서로 다른 포매터를 써서 계속 충돌한다.
        // 1.28.0 은 JVM 17+ 에서 동작하므로 CI 기준으로 고정. (1.30.0 은 JVM 21+ 요구)
        // 카탈로그에서 @pin 으로 막아 두었다. CI 의 JDK 를 올릴 때만 함께 올린다.
        googleJavaFormat(libs.versions.google.java.format.get())

        formatAnnotations()
    }
}

// `dependencyUpdates` 는 BOM 이 관리하는 의존성까지 포함해 전체 현황을 훑는 보고서다.
// 카탈로그를 실제로 고쳐 쓰는 것은 아래 versionCatalogUpdate 뿐이다.
// 두 도구 모두 마일스톤·RC 를 거르지만 판정 방식이 반대다. dependencyUpdates 는 사전 릴리스 표식이 있는 버전을 빼고,
// STABLE 은 정식판 형식인 버전만 받는다. 그래서 33.0.0-jre 처럼 수식어가 붙은 정식판은 dependencyUpdates 에만 보인다.
tasks.named("dependencyUpdates") {
    // 플러그인 내장 판정(alpha·beta·rc·M·snapshot·preview·커밋 해시 등)으로 사전 릴리스를 뺀다.
    // 이미 사전 릴리스를 쓰는 의존성에는 다음 사전 릴리스를 계속 보여 준다.
    // 한 번만 전부 보려면 ./gradlew dependencyUpdates --no-reject-pre-releases
    rejectPreReleases = true
}

versionCatalogUpdate {
    // README 예시 선택기는 대문자 SNAPSHOT/ALPHA 만 걸러 4.2.0-M1 같은 마일스톤·RC 를 통과시킨다.
    // STABLE 은 숫자·점·하이픈만 있거나 RELEASE/FINAL/GA 가 붙은 버전만 받는다.
    versionSelector(nl.littlerobots.vcu.plugin.resolver.VersionSelectors.STABLE)
}
