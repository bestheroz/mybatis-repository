name: test
on:
  push:
    branches: [ '**' ]
    tags-ignore: [ '**' ]

# 같은 브랜치에 연속으로 푸시하면 이전 실행을 취소한다.
# 배지 커밋 푸시가 뒤늦게 non-fast-forward 로 거절되는 것을 막는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.WORKFLOW_GITHUB_TOKEN }}

permissions:
  contents: write  # 레포지토리 내용 수정 권한 추가

jobs:
  spotless-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Set up JDK 17
        uses: actions/setup-java@main
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@main

      - name: Build with Gradle
        run: ./gradlew check jar --no-daemon

  run-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Set up JDK 17
        uses: actions/setup-java@main
        with:
          distribution: 'corretto'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@main
      - name: Build with Gradle
        run: ./gradlew test jacocoTestReport --no-daemon
      - name: Generate JaCoCo Badge
        uses: cicirello/jacoco-badge-generator@main
        with:
          jacoco-csv-file: build/reports/jacoco/test/jacocoTestReport.csv
      - name: Commit and push the badge (if it changed)
        uses: EndBug/add-and-commit@main
        with:
          default_author: github_actions
          message: 'Update coverage badge'
          add: '.github/badges/*.svg'
          # 실행 중 main 이 앞서 나간 경우(예: tag.yml 의 버전 커밋) 리베이스 후 푸시
          pull: '--rebase --autostash'
          push_attempts: '3'  # 실패하면 다시 pull 하고 재시도
